<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Boot Socket.IO Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif;
           background: #eff4fa; color: #182d44; }
    main { max-width: 740px; margin: 35px auto; padding: 22px;
           background: white; border-radius: 16px;
           box-shadow: 0 6px 26px #11263f16; }
    h1 { margin-top: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 9px; margin: 12px 0; }
    input { min-width: 0; flex: 1; padding: 12px; border: 1px solid #ccd9e8;
            border-radius: 8px; font-size: 15px; }
    button { border: 0; border-radius: 8px; background: #176fc0;
             color: white; padding: 12px 16px; cursor: pointer; }
    button:hover { background: #0c5093; }
    #messages { height: 330px; overflow-y: auto; padding: 12px;
                background: #f7faff; border: 1px solid #e1eafa;
                border-radius: 10px; }
    .line { padding: 6px 0; overflow-wrap: anywhere; }
    .note { color: #60758a; font-size: 13px; }
    #status { font-weight: bold; color: #b35f08; }
    #typing { min-height: 22px; color: #63778b; }
    @media (max-width: 530px) {
      main { margin: 0; border-radius: 0; padding: 15px; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>
<main>
  <h1>Live Room Chat</h1>
  <p class="note">Java Spring Boot + Socket.IO. Open two tabs to test.</p>
  <div>Status: <span id="status">Disconnected</span></div>
  <div class="row">
    <input id="name" placeholder="Your name" value="Alice">
    <input id="room" placeholder="Room e.g. java" value="java">
    <button id="join">Join / Switch Room</button>
  </div>
  <div id="messages" aria-live="polite"></div>
  <div id="typing"></div>
  <div class="row">
    <input id="message" placeholder="Write a message...">
    <button id="send">Send</button>
  </div>
</main>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
  const $ = id => document.getElementById(id);

  // Works locally (host:9092) AND in GitHub Codespaces (…-8080.app.github.dev -> …-9092.app.github.dev)
  const url = location.hostname.endsWith('.app.github.dev')
      ? location.protocol + '//' + location.hostname.replace('-8080.', '-9092.')
      : location.protocol + '//' + location.hostname + ':9092';

  const socket = io(url, {
    autoConnect: false,
    transports: ['websocket', 'polling'],
    reconnection: true
  });

  let currentName = '';
  let currentRoom = '';
  let typingTimer;

  function appendLine(text, cssClass = '') {
    const line = document.createElement('div');
    line.className = 'line ' + cssClass;
    line.textContent = text; // Safe: no HTML execution from messages
    $('messages').appendChild(line);
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  function requestJoin() {
    const name = $('name').value.trim();
    const room = $('room').value.trim();
    if (!name || !room) {
      appendLine('Enter a name and room.', 'note');
      return;
    }
    currentName = name;
    currentRoom = room;
    if (!socket.connected) socket.connect();
    else socket.emit('join_room', { name, room });
  }

  socket.on('connect', () => {
    $('status').textContent = 'Connected: ' + socket.id;
    if (currentName && currentRoom) {
      socket.emit('join_room', {
        name: currentName, room: currentRoom
      });
    }
  });

  socket.on('disconnect', reason => {
    $('status').textContent = 'Disconnected (' + reason + ')';
    appendLine('Connection lost. Reconnecting when possible.', 'note');
  });

  socket.on('connect_error', error => {
    $('status').textContent = 'Connection error';
    appendLine('Connection error: ' + error.message, 'note');
  });

  socket.on('joined_room', room => {
    appendLine('You are now in room: ' + room, 'note');
  });

  socket.on('system_message', text => appendLine('[System] ' + text, 'note'));
  socket.on('server_error', text => appendLine('[Error] ' + text, 'note'));

  socket.on('chat_message', data => {
    const time = new Date(data.time).toLocaleTimeString();
    appendLine('[' + time + '] ' + data.name + ': ' + data.text);
  });

  socket.on('typing', data => {
    if (data.name === currentName) return;
    $('typing').textContent = data.typing ? data.name + ' is typing...' : '';
  });

  function sendMessage() {
    const text = $('message').value.trim();
    if (!text || !socket.connected) return;
    socket.emit('send_message', { text });
    socket.emit('typing', false);
    $('message').value = '';
  }

  $('join').addEventListener('click', requestJoin);
  $('send').addEventListener('click', sendMessage);
  $('message').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });
  $('message').addEventListener('input', () => {
    if (!socket.connected) return;
    socket.emit('typing', true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket.emit('typing', false), 750);
  });
</script>
</body>
</html>
