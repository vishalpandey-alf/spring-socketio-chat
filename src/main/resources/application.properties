spring.application.name=spring-socketio-chat
server.port=8080
# Local-only by default; use 0.0.0.0 explicitly in Docker/LAN.
socket.host=${SOCKET_HOST:127.0.0.1}
socket.port=${SOCKET_PORT:9092}
# Replace this with your exact frontend origin in production.
socket.allowed-origin=${SOCKET_ALLOWED_ORIGIN:http://localhost:8080}
